name: ticknova-perf
services:
  postgres:
    environment:
      POSTGRES_DB: ticknova_perf
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ticknova_test -d ticknova_perf"]
  api:
    image: ticknova-api:perf-test
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ticknova_perf
      DB_USER: ticknova_test
      DB_PASSWORD: ${TEST_DB_PASSWORD:?Generate dedicated performance configuration}
      SESSION_TOKEN_PEPPER: ${SESSION_TOKEN_PEPPER:?Generate dedicated performance configuration}
      DEMO_SEED_ENABLED: "true"
      DEMO_INITIAL_PASSWORD: ${DEMO_INITIAL_PASSWORD:?Generate dedicated performance configuration}
      DOCLING_BASE_URL: http://docling:8000
      DOCLING_INTERNAL_TOKEN: ${DOCLING_INTERNAL_TOKEN:?Generate dedicated performance configuration}
      UPLOAD_ROOT: /var/lib/ticknova/uploads
      AI_PROVIDER: mock
      TZ: UTC
    tmpfs: ["/var/lib/ticknova/uploads:size=256m,mode=1777,uid=10001,gid=10001"]
    networks: [default, parser]
    depends_on:
      postgres: { condition: service_healthy }
      docling: { condition: service_healthy }
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/actuator/health/readiness]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
  web:
    image: ticknova-web:perf-test
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    environment:
      TICKNOVA_ENVIRONMENT: perf-test
    depends_on:
      api: { condition: service_healthy }
